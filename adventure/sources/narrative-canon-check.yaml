  - id: encounter.old-town
    provenance:
      - doc: Campaign Outline
        heading: Manor Route 1 — The Shattered
      - doc: Encounters
        heading: 6. Old Town — Shattered Route
    conflicts:
      - field: synopsis
        kind: contradiction
        confidence: low
        use: canon
        app: >-
          Possessions from six forgotten lives recombine into an unstable Chorus whose fragments migrate between bodies whenever they are
          dispersed.
        canon: >-
          During the Act II investigation, the cemetery's unresolved **Chorus** manifests six authentic but misassembled lives, normally one
          Corpus per PC. Silhouettes, skills, limbs, and other identity Fragments migrate across the wrong Shells when a Corpus is
          Dispersed.
        source: Campaign Outline:953
        note: >-
          Canon's Chorus is built from the cemetery's distributed grave Source field (bodily Head/Arms/Back Fragments), not from recombined
          possessions.
        proposed: >-
          The Party enters abandoned Old Town expecting the ruins of a Duskwood attack and instead finds details that refuse to fit the
          story. At the old cemetery they meet Tom, who calls everyone “Sunny” despite remembering people, places, objects, and
          relationships with remarkable precision. The cemetery's unresolved graves manifest six misassembled lives as an unstable Chorus
          whose fragments migrate between bodies whenever they are dispersed. The Party learns to recognize each person's recurring Pattern,
          find the grave and history it belongs to, and give that life a truthful Name; each Named Boundary restores one life and Anchors
          its grave. Old Town's buried truth becomes clear: its catastrophe began within the Colony, and the Shattered's habit of exposing
          evidence without preserving provenance risks repeating it. Tom is briefly relieved, but whoever he calls “Sunny” remains unfound.
