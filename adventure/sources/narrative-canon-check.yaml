  - id: event.the-veiled-house
    provenance:
      - doc: Campaign Outline
        heading: Manor Route 5 — Witnesses > The Veiled House → Witness Me > The Veiled House
    conflicts:
      - field: synopsis
        kind: contradiction
        confidence: low
        use: canon
        app: The failure eventually helped produce the Witnesses' practice of preserving relationships and the later House of Abiding.
        canon: >-
          The early Witnesses argued that the Order was destroying information by stripping true objects from the circumstances in which
          their meaning had existed. Eventually the Order suspended extraction and allowed Witness custodians to return objects and preserve
          the site in place.
        source: Campaign Outline:1754
        note: >-
          In canon the Witnesses' preservation practice predates the house (the Keeper argued against it); the failure vindicated it and
          produced the Order–Witness compromise (line 1760).
        proposed: >-
          The Crescent Island lead brings the Party to an old Keeper residence from before the House of Abiding existed. After its Keeper
          completed a Reading, the household remained full of emotionally resonant possessions arranged around a life no one remembered.
          Early attempts to remove and archive those objects made the manifestations worse. The failure vindicated the early Witnesses'
          practice of preserving relationships, won them sanctioned custodial authority, and eventually helped produce the Hall of
          Remembrance and the House of Abiding.
  - id: encounter.witness-me
    provenance:
      - doc: Campaign Outline
        heading: Manor Route 5 — Witnesses
      - doc: Encounters
        heading: 10. Witness Me — Veiled House
    conflicts:
      - field: synopsis
        kind: contradiction
        confidence: medium
        use: canon
        app: Rooms, routines, and arrangements begin collapsing into one another when objects are moved or isolated.
        canon: The house's topology changes once, at the moment of rupture.
        source: Campaign Outline:1786
        note: >-
          Canon: one rupture when the Knocker is removed, then a maze that is 'impossible but not mutable'; Encounters line 1378: 'The maze
          never changes after the rupture.'
        proposed: >-
          Darkwing applies the Hall of Remembrance lesson by identifying which possessions belong together, but the Veiled House
          demonstrates that those relationships remain incomplete without context. Removing the one object still where it belongs ruptures
          the house into an impossible but fixed maze of repeated Hearths. Resolution requires restoring not only which things were
          connected, but where and how those relationships existed.
      - field: variant:The Reading is Stopped:description
        kind: contradiction
        confidence: low
        use: canon
        app: Living Vara is repeatedly cast into the household's missing “Keeper” position even though none of its relationships belong to her.
        canon: The hostile manifestation is the same forgotten Order Keeper every time.
        source: Campaign Outline:1949
        note: >-
          Canon's Wound reconstructs the house's own forgotten Order Keeper and its object Context; neither Outline nor Encounters casts
          Vara into the role, so this may be invented rather than contradicted.
        # Rewritten from Encounters §10 (planning review, 2026-11-18): one trigger (the Knocker), one transformation into a fixed
        # maze, and the house's own forgotten Order Keeper; nothing in canon casts Vara into the role.
        proposed: >-
          The Party initially applies the lesson learned at the Hall of Remembrance, identifying which possessions belong together. But
          removing the Greater Insistent Door Knocker, the last object still in its historically correct place, ruptures the house once
          into an impossible but fixed labyrinth of repeated Hearths. The house's hostile manifestation is always the same forgotten Order
          Keeper who lived there, an overzealous custodian rather than a killer, and every wrong arrangement of its Context objects calls
          it up again. The Party must map the maze and
          restore not only which things were connected, but where and how those relationships existed. The encounter demonstrates that
          correct fragments placed in the wrong context can still produce a false identity.
