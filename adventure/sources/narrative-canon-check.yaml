        proposed: >-
          Under Totality, the boundaries between containment, Source, and reconstructed Pattern fail at Occlusion Containment. A great
          Veiled Dragon erupts from its prison and leaves carrying its own mobile Source. Other Incursions threaten staff and the city, the
          Sheep punishes broken observation, and an apparent Mother with her aquatic brood exposes a real Relationship that EGRESS's return
          plumbing has misunderstood. Restoring the mother–brood return circuit can reestablish containment for cell-bound Sources, leaving
          the Dragon, some escapees, damaged research, and the central Scar as unresolved truths. The Breach is the EGRESS front: its one
          outcome sets the Engram Vault's finale condition, its Finale Pressure, and the Memory Frames EGRESS can bring to The Burden.
