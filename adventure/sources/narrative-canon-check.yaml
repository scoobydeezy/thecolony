# Narrative canon check (2026-11-17): the app's narrative text against the source documents.
# HISTORICAL RECORD: every ruling below was applied by the narrative and branching merges (2026-11-18); the
# text now lives in the event / encounter files. Kept for provenance; editing it changes nothing.
# Four reviewers checked all 52 items; every quote below was verified verbatim against the item and the cited line,
# and every provenance heading resolves.
#
# For each conflict, set `use:`
#   canon   apply `proposed` (the source documents win)
#   app     keep the app's text
#   decide  still open: the app's text stays until ruled
# Ruled 2026-11-18 (the planning agent's review, accepted by the user, with "Pépé Sylvya" everywhere), then the three open
# items ruled by the user: 22 canon, 3 app (The Observer, Eclipse on the Succeeds path, The Thin Place's demonstration).
# Reviewer confidence no longer picks the default. The texts the review flagged as reassembled from obsolete
# mechanics were rewritten whole from Encounters.md (A Life, The Shape of Someone, Revolutionaries, Witness Me).
# You can also edit `proposed` before it is applied. Fields named variant:<path>:... are per-path versions; their
# fixes are applied with branching (step 2), the rest at this switch. `combined` holds one text for a field with
# several canon fixes; it matches the default choices, so if you change them there, it gets recomposed. `provenance` goes into each item's file.
