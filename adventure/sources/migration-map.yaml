# Migration map: canonical concepts moving from the 12 current source documents
# (in the parent "The Colony/" folder) into the book.
#
# status:   unmigrated | in-progress | migrated
# role:     states   — the location defines (part of) the concept
#           depends  — the location relies on the concept and must point at it once migrated
# heading:  heading path in the source doc, levels separated by " > " (validated by scripts/validate.mjs)
#
# A concept becomes "migrated" only when every provenance entry is reconciled and the user
# has approved any resolution that changed meaning.

retiredDocuments:
  Campaign Synopsis:
