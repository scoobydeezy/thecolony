evidence:
  - source: Campaign Vision
    use: Premise, incomplete institutional answers, player authorship, hope without a predetermined ending.
  - source: The Colony — Foundational Truths
    use: Founding before the Reading, memorial before Keepers, irregular Calling, six traditions, faction origins.
  - source: Campaign Outline
    use: Reading branches, Identity curriculum, promises, faction stance, current Observer timing, local recovery and skipped-route fallbacks.
  - source: GM Design Guide
    use: Session preparation, evidence, NPC protections, consequential combat, props, Observer restraint.
  - source: The Veiled
    use: Current viable Identity paths, persistent Restoration, Acceptance without a roll, anchoring requirements.
  - source: Faction Goals
    use: Current goal model, per-faction operations, five fronts, pending deadlines and balance work.
  - source: BOARD-GAME-REVIEW.md
    sections: ['17.3', '18.2', '18.3', '18.4', '18.10', '18.12', '18.13']
    use: Recover later adopted rulings; superseded summaries are not current procedures.
  - source: server/Services/ColonyTurnEngine.cs
    use: Confirm Character Phase order, consumed faction opportunity, eligibility, and stable tie-breaking; no engine changes.
  - source: Creatures and The Burden — Final Veiled Encounter
    use: Repeated six-PC level-12 tuning baseline, including Act I and finale; no inferred level-up cadence.
  - chat: Veiled vs Forgotten
    threadId: 6a650b8f-5340-83ea-b6b6-c6d8b65a4aca
    userTurn: 84a29d7c-4e06-4003-9794-666f8e9d83fd
    use: User describes five Keystones and evidence-dependent use; supports access rather than automatic answers.
    limit: Older double-lock and finale-order proposals are superseded by current exports and recorded rulings. The historical five-tool count is superseded by the user's six-Keystone ruling in this chat on 2026-11-18.
resolved:
  - "2026-11-18 user ruling: six Identity Keystones, with the Dawn Charter supporting Choice. Context remains without a Keystone. The existing Charter Keystone flag already agrees; no baseline flag change was needed."
  - Aletheia is the First Keeper, not the first memorial name. Corrected the Order's owning entry.
  - The Colony predates the Order. Corrected the Order's founding implication.
  - The Reading has no fixed annual schedule. Corrected the Ritual Chamber Asset summary.
  - The Observer ends Act II with branch-dependent eclipse timing; Eclipse opens Act III already under way.
  - Identity follows viable paths, not a universal pair of required locks; restored truth persists and Acceptance adds no roll or Pressure.
  - Current Faction Phase uses one token per eligible goal or threatened guard, Priority bonuses, and DC 10; retired wildcard and five-card allocation excluded.
  - Defection checks belong to the Character Phase; current Stress derives from in-force conditions.
  - NPC directory includes Forgotten and unavailable baseline states rather than implying everyone listed can appear.
editorialWork:
  - District orientation and institutional access examples synthesize owning entries; they establish no new distances, service fees, law, or alliance matrix.
  - Street examples are optional staging, not new canon scenes.
  - Faction comparison and directories are generated from owners, with separate SocialClass grouping.
  - The primer now points to procedural owners instead of repeating numeric mechanics and a forced first-encounter outcome.
open:
  - id: progression.schedule
    gap: Six level-12 PCs are the documented encounter baseline; no authoritative advancement schedule or complete treasure allocation found.
    treatment: User explicitly deferred the level schedule on 2026-11-18. Preserve the documented encounter baseline and reward guidance; no milestone schedule or complete treasure allocation is implied.
  - id: setting.map
    gap: Uploaded map images exist but are not identified as the canonical book map with scale, orientation, and district alignment.
    treatment: Location hierarchy and directory supplied; map selection and production remain open.
  - id: setting.ledger-location
    conflict: Ledger Asset starts in the Memorial Building; Empty Lectern describes returning it to the Hall after ceremonies.
    treatment: Preserve baseline and explain storage versus ceremonial use; no relocation invented.
  - id: setting.broken-bell
    conflict: Location describes an actual recovered bell; Asset describes a faded sign depicting a broken-away bell.
    treatment: Gazetteer links owners without choosing a new physical arrangement; reconcile when the location is expanded.
  - id: setting.mottos
    conflict: Foundational Truths uses earlier Order and Aspis mottos; current faction entries differ.
    treatment: Current owner values preserved; no new motto adopted in prose.
  - id: fronts.timing
    gap: Precise front deadlines, delegated execution, and balancing remain open in source tuning notes.
    treatment: Shared outcome rule transferred; individual clocks remain encounter responsibilities.
notClaimed:
  - Full campaign migration, all historical chat recovery, new narrative scene completion, combat balancing or playtesting.
  - Complete treasure plan, canonical city-map production, or completion of the proposed five-measure readiness tooling.
  - Reimplementation or exhaustive conformance audit of app scoring formulas.
