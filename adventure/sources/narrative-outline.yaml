          - { id: encounter.the-shape-of-someone, kind: encounter, title: The Shape of Someone, event: event.the-thin-place, appId: 0320f766-c0df-419c-ac5e-6b0f8b870b92 }
          - { id: event.the-institute, kind: event, title: The Institute, route: EGRESS, appId: 92ff33bd-760d-4b04-8e24-a63c533e816d }
