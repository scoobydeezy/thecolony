    # Rewritten whole from Encounters §7 (planning review, 2026-11-18): the raid design, not a Dispersal-and-test loop, and the Face
    # keeps its accumulated Weight (the revelation changes what it means, not whether it exists).
    combined:
      synopsis: >-
        The Party participates in the Cult's ritual by selecting artworks from its archive and describing what each image reveals. Their
        interpretations supply Forms to the Face of the Unknown, which has become a Source through generations of accumulated projections.
        A Composite manifestation assembles itself from those interpretations, taking Forms from stations around the battlefield. Darkwing
        contests the stations, removes Form Totems, and suppresses the Face's Ward by controlling two stations at once. Returning a Totem to
        the Face and relinquishing the assumption that it describes an external being permanently Releases that Form. After three
        Releases, the remaining projected Forms collapse. The Formless Shape reveals that the underlying Weight belongs to generations of
        people imagining the Unknown, not to a hidden person. Darkwing guides that Weight back into the Face; the Source becomes a
        truthful Anchor, and Maelyn can entrust it to Darkwing as a reusable Form Keystone. Exceptional early recognition can prevent the hostile Composite from forming.
