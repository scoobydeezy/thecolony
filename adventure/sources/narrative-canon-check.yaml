  - id: encounter.the-shape-of-someone
    provenance:
      - doc: Campaign Outline
        heading: Manor Route 2 — Cult of the Unknown
      - doc: Encounters
        heading: 7. The Shape of Someone — Cult Route
    conflicts:
      - field: synopsis
        kind: contradiction
        confidence: medium
        use: canon
        app: >-
          The Party supplies the Face of the Unknown with conflicting observations, assumptions, and artistic interpretations drawn from
          previous Veiled encounters.
        canon: >-
          A collection of small artworks or illustrated cards is placed before the Party. Each character selects one image that draws their
          attention and answers a simple prompt such as:
        source: Campaign Outline:1093
        note: Canon's projections come from each PC's interpretation of a selected Cult artwork/card, not from prior Veiled encounters.
        proposed: >-
          The Party supplies the Face of the Unknown with conflicting interpretations of artworks chosen from the Cult's archive. The mask
          accepts them all. A Composite manifestation forms and begins borrowing features from the Cult’s surrounding artwork, changing
          shape as paintings, sculptures, and inherited iconography feed its reconstruction. The Party must protect the resonant source
          object, trace which depictions are genuinely independent observations, and separate truthful Form from copied tradition and
          projection. Dispersing the Veiled creates opportunities to test competing shapes against the Face and prevent false features from
          returning. The Party ultimately discovers that the Cult has not been summoning Pilgrims through belief alone: existing mnemonic
          pressure is responding to the Forms its observers provide, and generations of Cult imagery have partly taught later manifestations
          what they are expected to look like. Maelyn entrusts the Party with the blank mask, turning the Face into a reusable tool for
          testing Form without the accumulated expectations of the Cult’s archive.
