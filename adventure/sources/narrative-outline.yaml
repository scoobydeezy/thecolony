          - { id: event.the-house-of-abiding, kind: event, title: The House of Abiding, appId: c4aff6ca-c9a3-48ce-af47-bbb397e9ca43 }
          - { id: encounter.bad-maps, kind: encounter, title: Bad Maps, appId: 07cda0c1-c1bc-44d2-a106-78a00b5ac20f }
          - { id: event.prisoners, kind: event, title: Prisoners, appId: d0b2e471-f2a7-4b36-a7fe-59f68063b7ac }
      - title: Session 3 investigations
        arrangement: alternatives
        # Selected by current Source state and Darkwing's choices (Campaign Outline, Session 3).
        items:
          - { id: encounter.a-life, kind: encounter, title: A Life, route: Witnesses, appId: 0083b759-7f7d-43d5-9f45-be172a453d5c }
          - { id: encounter.containment, kind: encounter, title: Containment, route: EGRESS, appId: 1a5d8d7f-678c-4c2e-a064-ae7be7d9e854 }
          - { id: encounter.duskwood, kind: encounter, title: Duskwood, route: Cult, appId: ff39c143-4ecd-4845-9b6c-26f3622af638 }
      - title: Act I climax
