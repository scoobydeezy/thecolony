    provenance:
      - doc: Campaign Outline
        heading: Session 3 — Dusk > Witness Route — A Life
      - doc: Encounters
        heading: 2. A Life — Evin Peakwalker Life Reconstruction
    conflicts:
      - field: synopsis
        kind: contradiction
        confidence: low
        use: canon
        app: >-
          Using the Ledger, the Caretaker traces the cloth toy to other holdings from progressively later stages of the same person's life.
          When those true but incompatible fragments begin reconstructing several versions of one person at once, the Party encounters
          another Veiled manifestation.
        canon: >-
          1. **Ordinary processing creates the accident.** The newly arrived cloth toy is placed near the childhood object during normal
          Hall procedure. Their compatible Relationship fragments recognize the same absent center.
        source: Encounters:118
        note: >-
          In Encounters the manifestation starts by accident during routine processing and the Ledger is used later (step 8) to find the
          shaving case; Campaign Outline's looser 'Using the Ledger and the Hall's holdings, several genuine but incomplete relationships
          begin reconstructing' is compatible with the app's ordering, so this is a sequencing nuance.
        proposed: >-
          The Witnesses begin with an almost boring tour of the Hall's archival and quarantine procedures. During ordinary processing, the
          newly arrived cloth toy is placed near a childhood object from the same forgotten life, and the two begin reconstructing it: an
          Infant and a Child manifest first. Finding the Child brings an archived bow into the active network, and an Adult manifests,
          hostile. Violence creates safety but does not resolve it. The Caretaker recognizes one continuous life in the matching initials,
          then uses the Ledger to identify a fourth Source, a shaving case, which the Party deliberately brings into the resonance. The
          exaggerated reconstructions collapse into one ordinary person, and restoring his true relationship to his mother ends the
          encounter. The Ledger cannot recover his name, but it proves that the infant was only one piece of an entire life.
