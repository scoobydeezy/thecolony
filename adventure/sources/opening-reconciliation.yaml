open:
  - id: opening.arrival-order
    question: What does the UFO mission order actually ask Darkwing to do?
    effect: Existing hook retained; no invented organization details or player backstory.
  - id: bad-maps.response
    question: When does the Order arrive, with which combatants, and how is that support represented in initiative?
    effect: Objectives are authored; exact combat timing and roster are not settled.
  - id: bad-maps.toy-durability
    question: What are the mundane toy's durability statistics after Breach, including reflected Backlash?
    effect: Universal destruction rules are linked; no guessed HP or Hardness.
  - id: bad-maps.dead-gressa
    question: How does transfer into an already dead Gressa work, as distinct from killing her after she becomes a living Source?
    effect: Sources allow the former but describe the result as living; unusual topology needs a ruling.
  - id: bad-maps.scar
    question: How does a Scar transfer affect an active Baby's condition and later reconstruction?
    effect: Universal transfer preserves the active Incursion; no extra bespoke profile invented.
  - id: window.condition-restored
    question: If the condition is restored after Pressure has exceeded the threshold, is reconstruction immediate or does a new Window start?
    effect: Existing rule design question retained; not silently resolved by encounter prose.
  - id: prisoners.exceptional-outcomes
    question: What are the Order's detention and release procedures after a prevented Incursion, revealed culprit, refusal, escape or unusual vessel outcome?
    effect: Ordinary sequence is drafted; no mandatory arrest or new legal procedure.
