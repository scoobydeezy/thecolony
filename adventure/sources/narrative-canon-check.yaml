  - id: encounter.revolutionaries
    provenance:
      - doc: Campaign Outline
        heading: Manor Route 4 — Dawn Assembly
      - doc: Encounters
        heading: 9. Revolutionaries — Dawn Route
    conflicts:
      - field: variant:The Reading is Stopped:description
        kind: contradiction
        confidence: high
        use: canon
        app: Miriel discovers her father's handwriting and an operational copy of the Dawn Charter.
        canon: "- letters between her grandparents demonstrating that **both were fully committed to the rescue** before the Reading;"
        source: Campaign Outline:1591
        note: >-
          The rescue-era hands are her grandparents'; 'Miriel's father respected that refusal' in the same field is also corrected to
          grandfather (Outline line 1531).
        # Rewritten from Encounters §9 (planning review, 2026-11-18): the six rescuers are Veiled that resemble Darkwing, with subtly
        # wrong anatomy, in the historical team's roles; the Party is not cast as the rescuers. Resolution is Choice: drop the rope.
        proposed: >-
          Miriel discovers her grandparents' letters and an operational copy of the Dawn Charter; the evidence proves that the historical
          rescue succeeded at everything except bringing the Keeper out. When the Party reopens the sealed breach into the Ritual Chamber,
          the tunnel's Wound recognizes living Vara as the Keeper to be extracted. Six remembered rescuers manifest in the historical team's
          roles, each unmistakably resembling a member of Darkwing but with subtly wrong anatomy, and begin hauling Vara toward the river.
          Pulling her back toward the Chamber is the same mistake with a different answer: neither end of the tug is victory. When Vara
          demands that the contest stop, Darkwing wins only by voluntarily abandoning it; the remembered Captain orders the stand-down and
          Choice is Restored. The truth surfaces in full: the Keeper chose to stay, and Miriel's grandfather respected her choice. The
          encounter forces the Party to confront whether stopping Vara's Reading preserved her agency or substituted the Party's choice for
          hers.
      - field: variant:The Reading Succeeds:description
        kind: contradiction
        confidence: high
        use: canon
        app: Miriel discovers her father's handwriting and an operational copy of the Dawn Charter.
        canon: "- Her **grandfather led the rescue team**."
        source: Campaign Outline:1531
        note: >-
          Grandfather, not father, led the rescue and ordered the stand-down; the proposed text fixes both occurrences ('father's
          handwriting', 'Miriel's father ordered').
        proposed: >-
          The tunnel's Wound assigns the Party the roles of the historical rescue party and gives an incomplete Keeper-shaped manifestation
          the role of the person to be extracted. Old signals, staging rooms, and evacuation procedures repeatedly push the encounter toward
          the river. Miriel discovers her grandparents' handwriting and an operational copy of the Dawn Charter. The evidence eventually
          proves that the historical rescue succeeded mechanically: Dawn reached the Keeper and the escape route was open. The Keeper
          knowingly refused to leave after encountering enough lives in the Book, and Miriel's grandfather ordered his people to respect
          that refusal. The Party learns that honoring a Keeper's choice does not require accepting the system that made the choice
          necessary.
      - field: variant:The Reading Succeeds:description
