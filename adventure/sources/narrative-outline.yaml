          # Encounter #11, the state-generated faction pile-up. Under your one-source rule it becomes an app record too.
          - { id: encounter.the-confluence, kind: encounter, title: The Confluence — Faction Pileup, event: event.the-confluence, appId: new }
          # User, 2026-11-18 (replaces the 2026-11-17 ruling): The Observer ends Act II and holds the whole reveal, in whichever
          # order the path puts it. Reading stopped: the eclipse begins at the Confluence, then the Observer calls the Party back.
