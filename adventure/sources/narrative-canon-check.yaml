    conflicts:
      - field: synopsis
        kind: contradiction
        confidence: medium
        use: canon
        app: new to the Colony and approaching his first Reading
        canon: >-
          The Consortium’s senior representative in the Colony is an obsessive administrator drowning in impossible paperwork. Debts have no
          debtors. Houses have no owners. Contracts bear signatures no one recognizes. He has spent years trying to prove that the errors
          are connected.
        source: Character Briefs:115
        note: >-
          Canon has Perrik spending years on the Colony's impossible records (only his first Reading, per Campaign Outline), so calling him
          'new to the Colony' conflicts; the outline itself only says he is approaching his first Reading.
        proposed: >-
          The Aspis Administrator walks the Party through debts without debtors, homes without remembered owners, and recurring accounting
          discontinuities he cannot explain. Before he can follow the pattern to its next lead, bells and commotion outside announce that a
          new Keeper has just been recognized. The House of Abiding is next door, and the Administrator—approaching his first Reading—is as
          curious as the Party.
