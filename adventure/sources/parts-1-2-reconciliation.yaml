date: '2026-11-18'
scope: Parts I and II; handbook and gazetteer, not additional narrative chapters.
status: compiled-for-review
sourcePolicy:
  baseline: Twelve current local exports; originals unchanged.
  retirement: Campaign Synopsis remains superseded by Campaign Vision and Campaign Outline.
  ownership: Authored chapters explain; rule entries own procedures; entity entries own facts; the app owns live campaign state.
  history: Accepted decisions are distinguished from assistant proposals and subsequently superseded mechanics.
