# Narrative outline, revision 4 (2026-11-18): the planning agent's review and the user's rulings applied; The Observer ends Act II.
#
# Every item on the app's Narrative page, sorted into chapters as an event or an encounter. This was
# the input for converting narrative content into canon files (scripts/merge-narrative.mjs, retired).
# HISTORICAL RECORD since the switch (2026-11-18): the chapters, sections and items now live in the
# chapter pages (src/content/docs/*/index.md) and the event / encounter files. Edit those, not this.
# Superseded here: encounter.the-confluence and encounter.totality were removed (user, 2026-11-18: those are
# narrative events, not encounters).
#
#   event      a narrative container
#   encounter  a complex scenario (maps, stat blocks, clocks). Its optional `event:` names the event it
#              belongs to (the link is stored once, on the encounter).
#
# The 18 encounters are the canonical roster in Encounters.md (#1 Bad Maps ... #18 The Burden).
#
# Sections: each chapter is divided into sections, and each section says how its items relate.
#   sequence      one after another, in the order listed
#   alternatives  routes selected by state and player choice; normally only some are played
#   concurrent    happening at the same time, independently (own deadlines; can be delegated or ignored)
#   optional      independent and optional, in any order
# The order inside an alternatives, concurrent or optional section is presentation order only, not
# chronology: "the narrative graph describes what can happen; navigation describes where to find it".
#
# Identity: `id` is the permanent canonical id; `appId` is the app record it takes over (title matching
# was only for drafting). `appId: new` means no app record exists yet: the file creates one.
#
# Prose (user, 2026-11-17): the source documents win where an item's app text contradicts them, as in the
# character merge. Every difference is reported for review; nothing is chosen silently.

chapters:
  - id: chapter.running-the-campaign
    title: Running Results Pending
    # General information: campaign introduction, GM procedures, reference. No events or encounters.
    sections: []

  - id: chapter.act-1
    title: Act I — The Secret
    sections:
      - title: Arrival and the first Incursion
        arrangement: sequence
        items:
